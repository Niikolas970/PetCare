spring.application.name=petcare-backend

# Conexión a MySQL (la contraseña llega por variable de entorno; SPRING_DATASOURCE_PASSWORD tiene prioridad)
spring.datasource.url=jdbc:mysql://localhost:3306/petcare_db
spring.datasource.username=petcare_app
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

server.port=8080

# Nunca enviar detalles internos de errores al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# JWT (la clave se lee de la variable de entorno JWT_SECRET, en Base64, mínimo 32 bytes)
petcare.jwt.secret=${JWT_SECRET}

# CORS: orígenes del frontend separados por comas (se puede sobrescribir con PETCARE_CORS_ALLOWED_ORIGINS)
petcare.cors.allowed-origins=http://localhost:5173

# Documentación (Swagger UI en /swagger-ui.html). En producción se desactiva (application-prod.properties)
petcare.docs.enabled=true
springdoc.api-docs.enabled=${petcare.docs.enabled}
springdoc.swagger-ui.enabled=${petcare.docs.enabled}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
