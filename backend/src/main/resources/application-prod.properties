# Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod
# Los secretos siguen llegando solo por variables de entorno (SPRING_DATASOURCE_PASSWORD, JWT_SECRET).

# Sin SQL en los logs
spring.jpa.show-sql=false

# Sin documentación pública: Swagger UI y /v3/api-docs quedan deshabilitados y no son públicos
petcare.docs.enabled=false

# Orígenes del frontend en producción: definir PETCARE_CORS_ALLOWED_ORIGINS (p. ej. https://petcare.example.com)
petcare.cors.allowed-origins=${PETCARE_CORS_ALLOWED_ORIGINS}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
